{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app: llm-gateway
type: Opaque
stringData:
  GROQ_API_KEY: {{ .Values.secrets.groqApiKey | default "" | quote }}
  GATEWAY_API_KEY: {{ .Values.secrets.gatewayApiKey | default "" | quote }}
{{- end }}