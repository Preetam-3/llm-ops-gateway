replicaCount: 1

image:
  repository: ghcr.io/your-username/llm-ops-gateway
  tag: latest
  pullPolicy: Always

service:
  type: NodePort
  port: 8000

# Secrets for the gateway. Prefer setting these via `--set`
# or a values override file; `existingSecret` lets you bring your
# own Secret instead of the one rendered by secrets.yaml.
secrets:
  existingSecret: ""
  groqApiKey: ""
  gatewayApiKey: "change-me"

config:
  groqModel: llama-3.1-8b-instant
  maxRequestsPerMinute: 30

# Kubernetes production hardening
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 1

redis:
  image: redis:7.2
  port: 6379

prometheus:
  image: prom/prometheus:v2.52.0
  port: 9090

grafana:
  image: grafana/grafana:11.0.0
  port: 3000

ingress:
  enabled: false
  host: llm-gateway.local
